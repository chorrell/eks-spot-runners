version: 2

# GitHub Actions and pre-commit hooks arrive as one monthly PR, which
# dependabot-automerge.yml merges when every update is minor or patch.
multi-ecosystem-groups:
  tooling:
    schedule:
      interval: "monthly"
    pull-request-branch-name:
      separator: "/"
    commit-message:
      prefix: "chore"
      include: "scope"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "tooling"
    cooldown:
      default-days: 7

  - package-ecosystem: "pre-commit"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "tooling"
    cooldown:
      default-days: 7

  # Terraform providers and modules, kept out of the auto-merged `tooling`
  # group: an EKS, Karpenter or AWS provider bump can change the cluster.
  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "monthly"
    groups:
      terraform:
        patterns:
          - "*"
    pull-request-branch-name:
      separator: "/"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
